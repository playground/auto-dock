<div class="flex flex-col mb-4" [ngClass]="{'items-end': isUser, 'items-start': isAssistant}">
  
  <!-- User message with avatar and controls -->
  <div *ngIf="isUser" class="flex items-start gap-3 w-full max-w-[80%] md:max-w-[70%]">
    <!-- User avatar -->
    <div class="flex-shrink-0 w-8 h-8 rounded-full bg-gray-700 dark:bg-gray-600 flex items-center justify-center text-white font-semibold text-sm">
      D
    </div>
    
    <!-- Message content and controls -->
    <div class="flex-grow">
      <div class="bg-gray-100 dark:bg-gray-800 rounded-lg px-4 py-2 text-gray-900 dark:text-gray-100">
        {{ message.content }}
      </div>
      
      <!-- Edit/Rerun controls below message -->
      <div class="flex items-center gap-2 mt-1 opacity-0 hover:opacity-100 transition-opacity">
        <button
          (click)="startEditing()"
          class="p-1 hover:bg-gray-200 dark:hover:bg-gray-700 rounded transition-colors"
          title="Edit message">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
          </svg>
        </button>
        <button
          (click)="rerunMessage()"
          class="p-1 hover:bg-gray-200 dark:hover:bg-gray-700 rounded transition-colors"
          title="Rerun message">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
  
  <!-- Version navigation for assistant messages with multiple versions -->
  <div *ngIf="isAssistant && hasMultipleVersions" class="flex items-center gap-2 mb-2 text-sm text-gray-600 dark:text-gray-400">
    <button
      (click)="previousVersion()"
      [disabled]="!canGoPrevious"
      class="p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700 disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
      title="Previous version">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
      </svg>
    </button>
    <span class="font-mono text-xs">
      {{ currentVersionDisplay }} / {{ totalVersions }}
    </span>
    <button
      (click)="nextVersion()"
      [disabled]="!canGoNext"
      class="p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700 disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
      title="Next version">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
      </svg>
    </button>
    <button
      (click)="regenerateResponse()"
      class="p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors ml-2"
      title="Regenerate response">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
      </svg>
    </button>
  </div>

  <!-- Edit mode for user messages -->
  <div *ngIf="isUser && isEditing" class="w-full max-w-[80%] md:max-w-[70%] ml-11">
    <textarea
      [(ngModel)]="editedContent"
      class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-primary-500"
      rows="3"
      (keydown.escape)="cancelEditing()"
      (keydown)="onKeyDown($event)">
    </textarea>
    <div class="flex justify-end gap-2 mt-2">
      <button
        (click)="cancelEditing()"
        class="px-3 py-1 text-sm bg-gray-200 dark:bg-gray-700 rounded-md hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
        Cancel
      </button>
      <button
        (click)="saveEdit()"
        class="px-3 py-1 text-sm bg-primary-600 text-white rounded-md hover:bg-primary-700 transition-colors">
        Save & Rerun
      </button>
    </div>
    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Press Ctrl+Enter to save, Esc to cancel</p>
  </div>
  
  <!-- Assistant message container -->
  <div *ngIf="isAssistant" class="message-container rounded-lg px-4 py-3 shadow-sm max-w-[95%] bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 rounded-tl-none">
    
    <!-- Tool executions (if any) -->
    <div *ngIf="message.toolExecutions && message.toolExecutions.length > 0" class="mb-4">
      <app-tool-execution
        *ngFor="let toolExec of message.toolExecutions; let i = index"
        [toolExecution]="toolExec"
        [index]="i">
      </app-tool-execution>
    </div>
    
    <!-- Message content with markdown support -->
    <div class="prose dark:prose-invert prose-sm max-w-none">
      <div [innerHTML]="message.content | markdown"></div>
    </div>
    
    <!-- Message status and timestamp -->
    <div class="flex justify-between items-center mt-2 text-xs text-gray-500 dark:text-gray-400">
      <span *ngIf="message.status && message.status !== 'sent'" class="mr-2">
        {{ statusText }}
      </span>
      <span class="ml-auto">{{ formattedTime }}</span>
    </div>
  </div>
</div>
