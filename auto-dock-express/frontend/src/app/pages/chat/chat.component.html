<div class="flex h-[calc(100vh-12rem)] relative">
  <!-- Sidebar with conversation list -->
  <div
    class="bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col transition-all duration-300 ease-in-out"
    [ngClass]="{
      'w-64': sidebarOpen,
      'w-0': !sidebarOpen
    }">
    <div class="w-64" [ngClass]="{'opacity-0': !sidebarOpen}">
    <div class="p-4 border-b border-gray-200 dark:border-gray-700">
      <button
        (click)="createNewConversation()"
        class="w-full flex items-center justify-center px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-md transition-colors">
        <span class="mr-2">+</span> New Chat
      </button>
    </div>
    
    <div class="flex-grow overflow-y-auto">
      <div *ngIf="conversationsWithMessages.length === 0" class="p-4 text-center text-gray-500 dark:text-gray-400">
        No conversations yet
      </div>
      
      <div *ngFor="let conversation of conversationsWithMessages"
           (click)="selectConversation(conversation.id)"
           class="p-3 border-b border-gray-200 dark:border-gray-700 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors flex justify-between items-center"
           [ngClass]="{'bg-gray-100 dark:bg-gray-700': currentConversation?.id === conversation.id}">
        <div class="truncate">
          <div class="font-medium">{{ conversation.title }}</div>
          <div class="text-xs text-gray-500 dark:text-gray-400">
            {{ conversation.updatedAt | timeAgo }}
          </div>
        </div>
        <button
          (click)="deleteConversation(conversation.id, $event)"
          class="text-gray-500 dark:text-gray-400 hover:text-red-500 dark:hover:text-red-400 p-1">
          <span class="sr-only">Delete</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>
    </div>
    </div>
  </div>
  
  <!-- Main chat area -->
  <div class="flex-grow flex flex-col bg-gray-50 dark:bg-gray-900">
    <!-- Header with toggle button and MCP menu -->
    <div class="flex items-center border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 px-4 py-2">
      <button
        (click)="toggleSidebar()"
        class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md transition-colors"
        [attr.aria-label]="sidebarOpen ? 'Close sidebar' : 'Open sidebar'">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path *ngIf="!sidebarOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          <path *ngIf="sidebarOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <div class="flex-grow"></div>
      <!-- MCP Server Menu -->
      <app-mcp-server-menu></app-mcp-server-menu>
    </div>
    
    <!-- Chat messages -->
    <div #messageContainer class="flex-grow overflow-y-auto p-4 pt-6">
      <div *ngIf="!currentConversation || currentConversation.messages.length === 0" 
           class="h-full flex items-center justify-center text-center p-4">
        <div class="max-w-md">
          <h2 class="text-2xl font-bold text-gray-700 dark:text-gray-300 mb-2">Start a conversation with MCP Orchestrator</h2>
          <p class="text-gray-600 dark:text-gray-400">
            Ask a question or start a conversation to see MCP Orchestrator in action.
          </p>
        </div>
      </div>
      
      <div *ngIf="currentConversation && currentConversation.messages.length > 0">
        <app-message-bubble
          *ngFor="let message of currentConversation.messages"
          [message]="message"
          (onEdit)="handleEdit($event)"
          (onRerun)="handleRerun($event)"
          (onVersionChange)="handleVersionChange($event)"
          (onRegenerate)="handleRegenerate(message)">
        </app-message-bubble>
      </div>
    </div>
    
    <!-- Message input -->
    <div class="border-t border-gray-200 dark:border-gray-700 p-4 bg-white dark:bg-gray-800">
      <div *ngIf="!mcpInitialized" class="flex items-center justify-center py-4">
        <app-loading-spinner size="sm"></app-loading-spinner>
        <span class="ml-2 text-gray-600 dark:text-gray-400">Initializing MCP servers...</span>
      </div>
      
      <!-- Prompts dropdown -->
      <div *ngIf="mcpInitialized && availablePrompts.length > 0" class="mb-3">
        <div class="relative inline-block" #promptDropdown>
          <button
            type="button"
            (click)="togglePromptDropdown(); $event.stopPropagation()"
            class="flex items-center gap-2 px-3 py-1.5 text-sm bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 rounded-md transition-colors"
            [class.opacity-50]="loadingPrompts"
            [disabled]="loadingPrompts">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span>Prompts ({{ availablePrompts.length }})</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform" [class.rotate-180]="showPromptDropdown" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          
          <!-- Prompts list -->
          <div *ngIf="showPromptDropdown"
               class="absolute bottom-full left-0 mb-2 w-64 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg max-h-64 overflow-y-auto z-50"
               (click)="$event.stopPropagation()">
            <div class="p-2">
              <div class="text-xs font-semibold text-gray-500 dark:text-gray-400 px-2 py-1">Available Prompts</div>
              <button
                *ngFor="let prompt of availablePrompts"
                type="button"
                (click)="openPromptDialog(prompt)"
                class="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md transition-colors">
                <div class="font-medium text-sm text-gray-900 dark:text-gray-100">{{ prompt.name }}</div>
                <div class="text-xs text-gray-500 dark:text-gray-400 truncate">{{ prompt.description }}</div>
                <div class="text-xs text-gray-400 dark:text-gray-500 mt-1">{{ prompt.server }}</div>
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <form *ngIf="mcpInitialized" [formGroup]="messageForm" (ngSubmit)="sendMessage()" class="flex items-stretch gap-2">
        <div class="flex-grow">
          <textarea
            formControlName="message"
            rows="2"
            placeholder="Type your message here..."
            class="w-full h-full border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent resize-none bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
          </textarea>
        </div>
        
        <button
          type="submit"
          [disabled]="messageForm.invalid || sending"
          class="px-4 bg-primary-600 hover:bg-primary-700 text-white rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center">
          <span *ngIf="!sending">Send</span>
          <app-loading-spinner *ngIf="sending" size="sm" color="white"></app-loading-spinner>
        </button>
      </form>
    </div>
  </div>
</div>

<!-- Prompt Dialog -->
<app-prompt-dialog
  [prompt]="selectedPrompt"
  [isOpen]="showPromptDialog"
  (close)="closePromptDialog()"
  (submit)="handlePromptSubmit($event)">
</app-prompt-dialog>
