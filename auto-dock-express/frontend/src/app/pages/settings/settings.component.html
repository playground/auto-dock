<div class="max-w-4xl mx-auto p-6">
  <!-- Redirect Message Banner -->
  <div *ngIf="showRedirectMessage" class="redirect-message-banner mb-6">
    <div class="redirect-message-content">
      <svg class="warning-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      <span class="redirect-message-text">{{ getRedirectMessage() }}</span>
      <button class="dismiss-button" (click)="dismissRedirectMessage()" aria-label="Dismiss message">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <h1 class="text-3xl font-bold mb-8 text-gray-800 dark:text-gray-200">Settings</h1>
  
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 mb-8">
    <h2 class="text-xl font-semibold mb-4 text-gray-800 dark:text-gray-200">Appearance</h2>
    
    <form [formGroup]="settingsForm" class="space-y-4">
      <div>
        <label for="theme" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Theme</label>
        <select
          id="theme"
          formControlName="theme"
          (change)="onThemeChange()"
          class="w-full border border-gray-300 dark:border-gray-600 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
          <option *ngFor="let theme of themes" [value]="theme.value">{{ theme.label }}</option>
        </select>
      </div>
    </form>
  </div>
  
  <!-- MCP Configuration Editor -->
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md mb-8">
    <app-mcp-config-editor></app-mcp-config-editor>
  </div>
  
  <!-- MCP Server Settings (includes AI Provider Credentials) -->
  <app-mcp-server-settings></app-mcp-server-settings>

</div>
